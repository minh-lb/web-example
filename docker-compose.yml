name: web-example

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
      MYSQL_DATABASE: ${DB_DATABASE:-web_example}
      MYSQL_USER: web_example
      MYSQL_PASSWORD: ${DB_PASSWORD:-local-web-example-password}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping --host=127.0.0.1 --user=root --password=${MYSQL_ROOT_PASSWORD:-local-root-password} --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 15

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: local-keycloak-admin
      KC_HOSTNAME: http://localhost:8080/idp
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /idp
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./nextjs/keycloak:/opt/keycloak/data/import:ro

  nestjs:
    build: ./nestjs
    image: web-example-nestjs:local
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment: &backend-env
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: ${DB_DATABASE:-web_example}
      DB_USERNAME: web_example
      DB_PASSWORD: ${DB_PASSWORD:-local-web-example-password}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-booking-shared-secret-change-before-sharing}
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

  queue-worker:
    image: web-example-nestjs:local
    build: ./nestjs
    depends_on:
      nestjs:
        condition: service_healthy
    environment: *backend-env
    command: ["node", "dist/worker.js"]

  nextjs:
    image: web-example-nextjs:local
    build: ./nextjs
    depends_on:
      nestjs:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      AUTH_SECRET: local-minibooking-dev-secret-change-me-before-sharing
      AUTH_URL: http://localhost:3000
      AUTH_TRUST_HOST: "true"
      AUTH_KEYCLOAK_ID: mini-booking
      AUTH_KEYCLOAK_SECRET: mini-booking-local-secret
      AUTH_KEYCLOAK_ISSUER: http://localhost:8080/idp/realms/mini-booking
      AUTH_KEYCLOAK_INTERNAL_ORIGIN: http://keycloak:8080
      BACKEND_INTERNAL_URL: http://nestjs:8000
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-local-booking-shared-secret-change-before-sharing}
    volumes:
      - ./nextjs:/app
      - nextjs-node-modules:/app/node_modules
      - nextjs-cache:/app/.next

volumes:
  mysql-data:
  redis-data:
  keycloak-data:
  nextjs-node-modules:
  nextjs-cache:
