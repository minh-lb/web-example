name: Web Example CI

on:
  pull_request:

jobs:
  nextjs-unit:
    name: Next.js unit and component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - run: npm ci
      - run: npm run test:unit

  nextjs-build:
    name: Next.js typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nextjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - name: Next.js production build
        env:
          AUTH_SECRET: local-minibooking-ci-build-secret
          AUTH_URL: http://localhost:3000
          AUTH_KEYCLOAK_ID: mini-booking
          AUTH_KEYCLOAK_SECRET: mini-booking-local-secret
          AUTH_KEYCLOAK_ISSUER: http://localhost:8080/idp/realms/mini-booking
          BACKEND_INTERNAL_URL: http://nestjs:8000
          INTERNAL_API_SECRET: local-booking-shared-secret-change-before-sharing
        run: npm run build

  nestjs-unit:
    name: NestJS domain unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build nestjs
      - run: docker run --rm web-example-nestjs:local npm run test:unit

  nestjs-integration:
    name: NestJS integration tests on MySQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DB_DATABASE: web_example_test
    steps:
      - uses: actions/checkout@v4
      - run: docker compose up -d --build --wait nestjs
      - run: docker compose exec -T nestjs npm run test:integration
      - if: failure()
        run: docker compose logs --tail=150 mysql redis nestjs
      - if: always()
        run: docker compose down -v

  playwright:
    name: Full Playwright E2E on MySQL and Redis
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_DATABASE: web_example_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install frontend
        run: cd nextjs && npm ci
      - name: Install Chromium
        run: cd nextjs && npx playwright install --with-deps chromium
      - name: Start isolated test stack
        run: docker compose up -d --build
      - name: Wait for HTTP services
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null 2>&1; then exit 0; fi
            sleep 2
          done
          docker compose logs --tail=150 nestjs nextjs
          exit 1
      - name: HTTP smoke
        run: cd nextjs && npm run test:smoke
      - name: Playwright E2E
        run: cd nextjs && npm run test:e2e
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --tail=200
      - name: Shutdown
        if: always()
        run: docker compose down -v

  required:
    # Keep the required check name aligned with the main branch ruleset.
    name: Unit, smoke, and E2E tests
    runs-on: ubuntu-latest
    needs: [nextjs-unit, nextjs-build, nestjs-unit, nestjs-integration, playwright]
    if: always()
    steps:
      - name: Verify all test jobs succeeded
        env:
          UNIT: ${{ needs.nextjs-unit.result }}
          BUILD: ${{ needs.nextjs-build.result }}
          DOMAIN: ${{ needs.nestjs-unit.result }}
          FEATURE: ${{ needs.nestjs-integration.result }}
          E2E: ${{ needs.playwright.result }}
        run: |
          test "$UNIT" = success
          test "$BUILD" = success
          test "$DOMAIN" = success
          test "$FEATURE" = success
          test "$E2E" = success
